services:
  mcp-tools:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BLENDER_MCP_PACKAGE: mcp-for-blender
        BAMBU_MCP_PACKAGE: bambu-printer-mcp@latest

    image: codex-3d-mcp-tools:latest
    container_name: 3d-mcp-tools

    env_file:
      - .env

    environment:
      # Direct LAN connection from Docker -> Computer 2 Blender MCP.
      BLENDER_HOST: "${BLENDER_HOST}"
      BLENDER_PORT: "${BLENDER_PORT:-9876}"
      BLENDER_MCP_SAFE_MODE: "${BLENDER_MCP_SAFE_MODE:-1}"
      MCP_TRANSPORT: stdio

    volumes:
      - ./:/workspace

    init: true
    restart: unless-stopped
